<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body {
  font-family: Arial;
  padding:20px;
}
.logo{
  text-align:center;
  font-size:40px;
  color:orange;
}
input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  width:100%;
  padding:12px;
  background:orange;
  border:none;
  color:white;
  font-size:16px;
  border-radius:25px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="logo">HEKO</div>

<h2>Welcome</h2>

<input type="text" placeholder="Phone Number">

<button>Login</button>

<p style="text-align:center">
Don't have account? <span style="color:orange">Register</span>
</p>

</body>
</html>
