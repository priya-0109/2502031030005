<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEKO App</title>

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', sans-serif;
}

body{
  background:#f7f7f7;
}

/* HEADER */
.header{
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.location{
  font-weight:600;
}

.icons{
  display:flex;
  gap:15px;
  font-size:18px;
}

/* SEARCH */
.search{
  margin:10px 15px;
}

.search input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#eee;
}

/* BANNER */
.banner{
  margin:10px 15px;
  padding:20px;
  border-radius:15px;
  background:#cde5c1;
}

.banner h2{
  font-size:18px;
}

.banner p{
  margin-top:5px;
  font-size:12px;
}

/* SECTION TITLE */
.section{
  margin:15px;
  display:flex;
  justify-content:space-between;
}

.section h3{
  font-size:18px;
}

/* CATEGORY */
.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:0 15px;
}

.cat-card{
  min-width:90px;
  background:#fff;
  border-radius:12px;
  padding:10px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.05);
}

.cat-card img{
  width:50px;
}

/* PRODUCTS */
.products{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 15px;
}

.product{
  min-width:140px;
  background:#fff;
  border-radius:15px;
  padding:10px;
  box-shadow:0 3px 6px rgba(0,0,0,0.05);
}

.product img{
  width:100%;
  height:90px;
  object-fit:contain;
}

.price{
  color:#ff7a00;
  font-weight:bold;
}

.old{
  text-decoration:line-through;
  color:gray;
  font-size:12px;
}

/* BUTTON */
.btn{
  margin-top:8px;
  width:100%;
  padding:8px;
  border-radius:20px;
  border:none;
  background:#ff7a00;
  color:white;
}

/* BOTTOM NAV */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  display:flex;
  justify-content:space-around;
  padding:10px;
  border-top:1px solid #ddd;
}

.nav div{
  text-align:center;
  font-size:12px;
}

.active{
  color:#ff7a00;
}

/* RESPONSIVE */
@media (min-width:600px){
  body{
    max-width:400px;
    margin:auto;
    border:1px solid #ddd;
  }
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="location">📍 Ahmedabad</div>
  <div class="icons">🛒 🔔</div>
</div>

<!-- SEARCH -->
<div class="search">
  <input type="text" placeholder="Search groceries...">
</div>

<!-- BANNER -->
<div class="banner">
  <h2>Vegetables & Fruits</h2>
  <p>Discounts on seasonal fruits</p>
</div>

<!-- CATEGORY -->
<div class="section">
  <h3>Categories</h3>
  <span style="color:#ff7a00;">See All</span>
</div>

<div class="categories">
  <div class="cat-card">
    <img src="https://cdn-icons-png.flaticon.com/512/1046/1046784.png">
    <p>Grocery</p>
  </div>

  <div class="cat-card">
    <img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png">
    <p>Frozen</p>
  </div>

  <div class="cat-card">
    <img src="https://cdn-icons-png.flaticon.com/512/2153/2153788.png">
    <p>Fruits</p>
  </div>
</div>

<!-- PRODUCTS -->
<div class="section">
  <h3>Vegetables</h3>
</div>

<div class="products">

  <div class="product">
    <img src="https://cdn-icons-png.flaticon.com/512/2909/2909765.png">
    <p>Broccoli</p>
    <span class="price">₹20</span>
    <span class="old">₹40</span>
    <button class="btn">Add</button>
  </div>

  <div class="product">
    <img src="https://cdn-icons-png.flaticon.com/512/2909/2909753.png">
    <p>Carrot</p>
    <span class="price">₹25</span>
    <span class="old">₹40</span>
    <button class="btn">Add</button>
  </div>

  <div class="product">
    <img src="https://cdn-icons-png.flaticon.com/512/415/415733.png">
    <p>Capsicum</p>
    <span class="price">₹15</span>
    <span class="old">₹30</span>
    <button class="btn">Add</button>
  </div>

</div>

<!-- NAVBAR -->
<div class="nav">
  <div class="active">🏠<br>Home</div>
  <div>📂<br>Category</div>
  <div>🛍<br>Order</div>
  <div>👤<br>Profile</div>
</div>

</body>
</html>
